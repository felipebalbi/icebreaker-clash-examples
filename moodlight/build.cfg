###############################################################################
#
# Required tooling for targeting the iCEbreaker (Lattice iCE40 UP5K, sg48).
# Don't modify this file directly. Instead, copy it to `build.cfg.local` and
# introduce any required changes there (build.cfg.local takes precedence and
# is gitignored).
#
# The Haskell side uses cabal (Clash -> Verilog, unit tests, fourmolu); the gate
# tools (yosys/nextpnr-ice40/icepack/iceprog) all ship in the YosysHQ OSS CAD
# Suite:  https://github.com/YosysHQ/oss-cad-suite-build/releases
###############################################################################

# Clash -> Verilog (via cabal). `-v0` keeps cabal's build chatter out of the
# codegen step so only Clash's own output shows.
CLASH = cabal run -v0 clash --

# Haskell unit tests.
TEST = cabal test

# Haskell formatter. Style lives in fourmolu.yaml. Install with
# `cabal install fourmolu` or grab a static binary from the fourmolu releases.
FOURMOLU = fourmolu

# RTL synthesis -- https://github.com/YosysHQ/yosys
YOSYS = yosys

# Place & route -- https://github.com/YosysHQ/nextpnr
PNR = nextpnr-ice40

# Bitstream packing -- https://github.com/YosysHQ/icestorm
PACK = icepack

# Programming -- https://github.com/YosysHQ/icestorm
PROG = iceprog

###############################################################################
